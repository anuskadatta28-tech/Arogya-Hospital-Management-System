
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Records - Arogya Hospital</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <div class="logo">Arogya Hospital</div>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/doctors}">Doctors</a>
        <a th:href="@{/appointments}">Appointments</a>
    </nav>
</header>

<div class="table-container">

    <h1>Doctor Records</h1>

    <a th:href="@{/doctors/new}" class="btn">+ Add New Doctor</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Specialization</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Available Days</th>
                <th>Available Time</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="doctor : ${doctors}">
                <td th:text="${doctor.doctorId}"></td>
                <td th:text="${doctor.name}"></td>
                <td th:text="${doctor.specialization}"></td>
                <td th:text="${doctor.phone}"></td>
                <td th:text="${doctor.email}"></td>
                <td th:text="${doctor.availableDays}"></td>
                <td th:text="${doctor.availableTime}"></td>

                <td>
                    <a th:href="@{/doctors/edit/{id}(id=${doctor.doctorId})}">
                        Edit
                    </a>

                    <form th:action="@{/doctors/delete/{id}(id=${doctor.doctorId})}"
                          method="post" style="display:inline;">

                        <button type="submit"
                                onclick="return confirm('Are you sure you want to delete this doctor?')">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(doctors)}">
                <td colspan="8">No doctor records found.</td>
            </tr>
        </tbody>
    </table>

    <br>

    <a th:href="@{/}" class="btn secondary">Back to Home</a>

</div>

</body>
</html>
